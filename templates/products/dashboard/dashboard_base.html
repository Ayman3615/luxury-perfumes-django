<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة التحكم | المتجر{% endblock %}</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #151515;
            --gold: #d4af37;
            --gold-hover: #f1c40f;
            --text-light: #f5f5f5;
            --text-muted: #aaa;
            --border: #2a2a2a;
            --glow: rgba(212, 175, 55, 0.15);
        }

        /* 🌟 أنيميشن الدخول السلس */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 🌟 القائمة الجانبية (Sidebar) */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
            border-left: 1px solid var(--border);
            padding: 25px 15px;
            position: fixed;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .sidebar h2 {
            text-align: center;
            color: var(--gold);
            margin-top: 0;
            margin-bottom: 35px;
            font-size: 24px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 20px;
            text-shadow: 0 0 10px var(--glow);
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* تأثيرات الوقوف والتفعيل في القائمة */
        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: white;
            transform: translateX(-5px);
        }

        .sidebar a.active {
            background: linear-gradient(90deg, var(--glow) 0%, transparent 100%);
            color: var(--gold);
            border-right: 4px solid var(--gold);
            box-shadow: inset -5px 0 15px transparent;
        }

        /* 🌟 المحتوى الرئيسي */
        .main-content {
            flex-grow: 1;
            margin-right: 260px; /* تعويض عرض القائمة الجانبية */
            padding: 40px;
            animation: fadeUp 0.6s ease-out forwards;
            box-sizing: border-box;
        }

        /* تنسيقات عامة للوحة */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            animation: slideInRight 0.5s ease-out forwards;
        }

        .btn-gold {
            background: var(--gold);
            color: #111;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow);
        }

        .btn-gold:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        /* 🌟 الجداول */
        .table-container {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 25px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 18px 15px;
            text-align: right;
            border-bottom: 1px solid #222;
            color: #ccc;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        th {
            color: var(--gold);
            font-weight: 700;
            background: #111;
            border-bottom: 2px solid var(--border);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: white;
        }

        /* تنسيق الروابط السفلية في القائمة */
        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 20px 15px;
        }

    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="sidebar">
        <h2>👑 الإدارة</h2>

        <a href="{% url 'dashboard_home' %}" class="{% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">📊 الرئيسية</a>
        <a href="{% url 'dashboard_product_list' %}" class="{% if request.resolver_match.url_name == 'dashboard_product_list' %}active{% endif %}">📦 إدارة المنتجات</a>
        <a href="{% url 'dashboard_orders' %}" class="{% if request.resolver_match.url_name == 'dashboard_orders' %}active{% endif %}">🛒 إدارة الطلبات</a>
        <a href="{% url 'dashboard_coupon_list' %}" class="{% if request.resolver_match.url_name == 'dashboard_coupon_list' %}active{% endif %}">🎟️ إدارة الكوبونات</a>
        <a href="{% url 'dashboard_customer_list' %}" class="{% if request.resolver_match.url_name == 'dashboard_customer_list' %}active{% endif %}">👥 إدارة العملاء</a>
        <a href="{% url 'dashboard_review_list' %}" class="{% if request.resolver_match.url_name == 'dashboard_review_list' %}active{% endif %}">⭐️ إدارة التقييمات</a>

        <div class="sidebar-divider"></div>

        <a href="{% url 'home' %}" style="color: #888;">🌍 العودة للمتجر</a>
        <a href="{% url 'logout' %}" style="color: #e74c3c;">🚪 تسجيل الخروج</a>
    </div>

    <div class="main-content">
        {% block dashboard_content %}
        {% endblock %}
    </div>

</body>
</html>
