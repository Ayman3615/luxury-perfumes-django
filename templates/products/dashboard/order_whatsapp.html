{% extends 'products/dashboard/dashboard_base.html' %} <!-- غير ده حسب مسار الـ layout بتاعك -->

{% block title %}رسالة واتساب للطلب #{{ order.id }}{% endblock %}

{% block extra_css %}
<style>
    /* حاوية الواتساب الرئيسية */
    .whatsapp-preview-wrapper {
        max-width: 600px;
        margin: 30px auto;
        background: #efeae2; /* لون خلفية واتساب ويب */
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: hidden;
        border: 1px solid #ddd;
        direction: rtl;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* رأس الشات (الهيدر الأخضر) */
    .wa-header {
        background: #008069;
        color: white;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .wa-avatar {
        width: 45px; height: 45px;
        background: #fff; color: #008069;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: bold; font-size: 20px;
    }
    .wa-contact-info h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .wa-contact-info p { margin: 0; font-size: 12px; opacity: 0.8; }

    /* منطقة الرسائل */
    .wa-chat-body {
        padding: 30px 20px;
        background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); /* نقوشات واتساب */
        background-repeat: repeat;
        background-size: contain;
        background-blend-mode: multiply;
        background-color: #efeae2;
        min-height: 300px;
    }

    /* فقاعة الرسالة نفسها */
    .wa-bubble {
        background: #d9fdd3; /* اللون الأخضر الفاتح لفقاعة الإرسال */
        color: #111;
        padding: 12px 16px;
        border-radius: 8px 0 8px 8px; /* شكل الفقاعة */
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        display: inline-block;
        max-width: 90%;
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap; /* يحافظ على المسافات والسطور */
        position: relative;
    }

    /* مثلث الفقاعة */
    .wa-bubble::before {
        content: '';
        position: absolute;
        top: 0; right: -10px;
        border: 10px solid transparent;
        border-top-color: #d9fdd3;
        border-left-color: #d9fdd3;
    }

    /* منطقة الأزرار تحت الشات */
    .wa-actions {
        background: #fff;
        padding: 20px;
        display: flex;
        gap: 15px;
        border-top: 1px solid #ddd;
    }

    .wa-btn {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.3s;
        text-decoration: none;
    }
    
    .btn-send { background: #25D366; color: white; }
    .btn-send:hover { background: #1fb857; transform: translateY(-2px); }
    
    .btn-copy { background: #f0f2f5; color: #54656f; border: 1px solid #ddd; }
    .btn-copy:hover { background: #e9edef; transform: translateY(-2px); }
</style>
{% endblock %}

{% block dashboard_content %}
<!-- غير اسم البلوك حسب القالب بتاعك -->
<div class="whatsapp-preview-wrapper">
    <!-- هيدر الشات -->
    <div class="wa-header">
        <div class="wa-avatar">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm9 11a1 1 0 0 1-2 0v-2a3 3 0 0 0-3-3H8a3 3 0 0 0-3 3v2a1 1 0 0 1-2 0v-2a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v2z"/></svg>
        </div>
        <div class="wa-contact-info">
            <h3>{{ order.name }}</h3>
            <p>{{ whatsapp_phone }}</p>
        </div>
    </div>

    <!-- مكان الرسالة -->
    <div class="wa-chat-body">
        <div class="wa-bubble" id="message-content">{{ message }}</div>
    </div>

    <!-- الأزرار -->
    <div class="wa-actions">
        <a href="https://wa.me/{{ whatsapp_phone }}?text={{ encoded_message }}" target="_blank" class="wa-btn btn-send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.898-4.45 9.898-9.892 0-5.442-4.45-9.892-9.893-9.892-5.442 0-9.893 4.45-9.893 9.892 0 1.956.55 3.655 1.528 5.245l-1.162 4.241 4.33-1.186z"/>
            </svg>
            إرسال عبر WhatsApp
        </a>
        
        <button onclick="copyMessage()" class="wa-btn btn-copy" id="copyBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
            نسخ لشركة الشحن
        </button>
    </div>
</div>

<script>
    function copyMessage() {
        const text = document.getElementById("message-content").innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById("copyBtn");
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ تم النسخ بنجاح";
            btn.style.color = "#008069";
            btn.style.borderColor = "#008069";
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.color = "";
                btn.style.borderColor = "";
            }, 2000);
        });
    }
</script>
{% endblock %}
